<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Count Generator by A.R.C. Alberto</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5c6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cash Count">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#eef2f4;
    --surface:#ffffff;
    --surface-2:#f6f9fa;
    --border:#dde3e7;
    --border-strong:#c7cfd5;
    --ink:#16212b;
    --ink-2:#4b5a68;
    --ink-3:#7c8b99;
    --accent:#1f5c6e;
    --accent-ink:#ffffff;
    --accent-soft:#e3eef0;
    --accent-soft-ink:#144452;
    --success:#2f7d5a;
    --success-soft:#e4f2ea;
    --warning:#b8721c;
    --warning-soft:#fbeedd;
    --critical:#b0392f;
    --critical-soft:#fbe7e4;
    --focus:#3b82a6;
    --type-financial:#1f6f6b;
    --type-financial-soft:#e2f0ee;
    --type-compliance:#a8631a;
    --type-compliance-soft:#f7ecdc;
    --type-performance:#6b4e8a;
    --type-performance-soft:#efe8f5;
    --type-it:#3e5c8a;
    --type-it-soft:#e6ecf6;
    --shadow: 0 1px 2px rgba(20,30,40,.06), 0 6px 20px rgba(20,30,40,.05);
    --radius: 10px;
    --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10171d;
      --surface:#182229;
      --surface-2:#1d2830;
      --border:#2c3944;
      --border-strong:#3a4a56;
      --ink:#e8edf0;
      --ink-2:#aebbc4;
      --ink-3:#7f8f9b;
      --accent:#5fb3ac;
      --accent-ink:#0b2320;
      --accent-soft:#1d3a3a;
      --accent-soft-ink:#a9dcd6;
      --success:#5fb98a;
      --success-soft:#1a3327;
      --warning:#e0a552;
      --warning-soft:#3a2c16;
      --critical:#e2887d;
      --critical-soft:#3a201d;
      --focus:#5fb3ac;
      --type-financial:#5fb3ac;
      --type-financial-soft:#1a3230;
      --type-compliance:#d99a52;
      --type-compliance-soft:#332711;
      --type-performance:#b49bd6;
      --type-performance-soft:#2a2338;
      --type-it:#8ca7d6;
      --type-it-soft:#20293a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10171d;
    --surface:#182229;
    --surface-2:#1d2830;
    --border:#2c3944;
    --border-strong:#3a4a56;
    --ink:#e8edf0;
    --ink-2:#aebbc4;
    --ink-3:#7f8f9b;
    --accent:#5fb3ac;
    --accent-ink:#0b2320;
    --accent-soft:#1d3a3a;
    --accent-soft-ink:#a9dcd6;
    --success:#5fb98a;
    --success-soft:#1a3327;
    --warning:#e0a552;
    --warning-soft:#3a2c16;
    --critical:#e2887d;
    --critical-soft:#3a201d;
    --focus:#5fb3ac;
    --type-financial:#5fb3ac;
    --type-financial-soft:#1a3230;
    --type-compliance:#d99a52;
    --type-compliance-soft:#332711;
    --type-performance:#b49bd6;
    --type-performance-soft:#2a2338;
    --type-it:#8ca7d6;
    --type-it-soft:#20293a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em;}
  a{color:var(--accent);}
  button{font-family:var(--font-body);}
  input,select,textarea{font-family:var(--font-body);font-size:13.5px;color:var(--ink);}
  ::selection{background:var(--accent-soft);}
  svg{width:1em;height:1em;flex:none;vertical-align:-0.15em;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .num{font-variant-numeric:tabular-nums;}

  #app{min-height:100%;}
  .shell{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px;flex:0 0 230px;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
  .brand-mark{
    display:flex;align-items:center;gap:10px;margin-bottom:2px;
  }
  .brand-crest{
    width:30px;height:30px;border-radius:7px;background:linear-gradient(155deg,var(--accent),var(--type-it));
    display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
    font-family:var(--font-display);font-weight:700;font-size:15px;flex:none;
  }
  .brand-title{font-family:var(--font-display);font-weight:700;font-size:16.5px;line-height:1.15;}
  .brand-title small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;margin-top:2px;}
  .brand-edit{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:11px;padding:2px 0 0;text-align:left;}
  .brand-edit:hover{color:var(--accent);text-decoration:underline;}

  nav.navlist{padding:10px;flex:1;overflow-y:auto;}
  .navlink{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;
    color:var(--ink-2);text-decoration:none;cursor:pointer;font-size:13.5px;font-weight:500;
    border:1px solid transparent;margin-bottom:2px;user-select:none;
  }
  .navlink:hover{background:var(--surface-2);color:var(--ink);}
  .navlink.active{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .navlink .ico{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;}
  .navlink .ico svg{width:17px;height:17px;}

  .sidebar-foot{border-top:1px solid var(--border);padding:12px;}
  .identity{
    display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;
  }
  .identity:hover{background:var(--surface-2);border-color:var(--border);}
  .avatar{
    width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none;
  }
  .identity-name{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2;}
  .identity-sub{font-size:11px;color:var(--ink-3);}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:18px 28px;border-bottom:1px solid var(--border);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:var(--surface);
  }
  .topbar h1{font-size:22px;}
  .topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:3px;}
  .view{padding:24px 28px 60px;max-width:1180px;}
  .view[hidden]{display:none;}

  .permnote{
    display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:9px 12px;font-size:12px;color:var(--ink-2);margin-bottom:18px;
  }
  .permnote svg{flex:none;margin-top:1px;width:14px;height:14px;color:var(--ink-3);}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px;}
  .grid > *{min-width:0;}
  .split-2col > *{min-width:0;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card-pad{padding:18px 20px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
  .card-head h3{font-size:15.5px;}
  .card-head .sub{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px;}

  .stat-tile{padding:16px 18px;}
  .stat-tile .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;}
  .stat-tile .stat-value{font-family:var(--font-display);font-size:30px;font-weight:700;margin-top:6px;}
  .stat-tile .stat-foot{font-size:11.5px;color:var(--ink-3);margin-top:4px;}

  .quicklink{
    display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow);
  }
  .quicklink:hover{border-color:var(--border-strong);}
  .quicklink .ico{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent-soft-ink);display:flex;align-items:center;justify-content:center;flex:none;}
  .quicklink .ico svg{width:18px;height:18px;}
  .quicklink strong{font-size:13.5px;display:block;}
  .quicklink span{font-size:11.5px;color:var(--ink-3);}

  /* ---------- Buttons / inputs ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;line-height:1.2;white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-3);}
  .btn:focus-visible, a:focus-visible, .navlink:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--focus);outline-offset:2px;
  }
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{color:var(--critical);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;letter-spacing:.01em;}
  .field{margin-bottom:13px;}
  .field-row{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--ink);
  }
  textarea{resize:vertical;min-height:64px;}
  input::placeholder,textarea::placeholder{color:var(--ink-3);}

  .searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .searchbar input[type=text]{max-width:280px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    padding:6px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);
    font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2);
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;}
  .table-wrap{overflow-x:auto;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;background:var(--surface-2);}
  tr:last-child td{border-bottom:none;}
  td.actions{white-space:nowrap;text-align:right;}

  /* ---------- Badges / pills ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;}
  .badge-financial{background:var(--type-financial-soft);color:var(--type-financial);}
  .badge-compliance{background:var(--type-compliance-soft);color:var(--type-compliance);}
  .badge-performance{background:var(--type-performance-soft);color:var(--type-performance);}
  .badge-it{background:var(--type-it-soft);color:var(--type-it);}
  .badge-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .pill{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);}
  .pill-success{background:var(--success-soft);color:var(--success);border-color:transparent;}
  .pill-warning{background:var(--warning-soft);color:var(--warning);border-color:transparent;}
  .pill-critical{background:var(--critical-soft);color:var(--critical);border-color:transparent;}
  .pill-sample{background:var(--surface-2);color:var(--ink-3);border-style:dashed;}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-3);}
  .empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.6;}
  .empty p{margin:2px 0;font-size:13px;}

  /* ---------- Calendar ---------- */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .cal-nav{display:flex;align-items:center;gap:8px;}
  .cal-month-label{font-family:var(--font-display);font-weight:700;font-size:16px;min-width:150px;text-align:center;}
  .cal-viewtoggle{display:flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden;}
  .cal-viewtoggle button{border:none;background:var(--surface);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2);}
  .cal-viewtoggle button.active{background:var(--accent);color:var(--accent-ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--border);gap:1px;}
  .cal-dow{background:var(--surface-2);padding:7px 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:center;}
  .cal-cell{background:var(--surface);min-height:96px;padding:6px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;}
  .cal-cell:hover{background:var(--surface-2);}
  .cal-cell.other-month{background:var(--bg);}
  .cal-cell.other-month .cal-daynum{color:var(--ink-3);}
  .cal-daynum{font-size:11.5px;font-weight:600;color:var(--ink-2);}
  .cal-daynum.today{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);}
  .cal-evt{font-size:10.5px;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .cal-more{font-size:10px;color:var(--ink-3);font-weight:600;padding-left:5px;}

  .agenda-group{margin-bottom:22px;}
  .agenda-month{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-bottom:8px;}
  .agenda-item{
    display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:9px;
    background:var(--surface);margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;
  }
  .agenda-date{width:46px;flex:none;text-align:center;}
  .agenda-date .d{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1;}
  .agenda-date .m{font-size:10px;color:var(--ink-3);text-transform:uppercase;font-weight:700;}
  .agenda-body{flex:1;min-width:0;}
  .agenda-title{font-weight:600;font-size:13.5px;margin-bottom:3px;}
  .agenda-meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,22,28,.5);display:flex;align-items:flex-start;justify-content:center;
    padding:5vh 16px;overflow-y:auto;z-index:100;
  }
  .modal{
    background:var(--surface);border-radius:12px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);
    border:1px solid var(--border);
  }
  .modal.wide{max-width:820px;}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{font-size:16px;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1;padding:4px;}
  .modal-close:hover{color:var(--ink);}
  .modal-body{padding:18px 20px;max-height:72vh;overflow-y:auto;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

  /* ---------- Toast ---------- */
  #toastwrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:320px;
  }
  .toast.err{background:var(--critical);color:#fff;}
  .toast.ok{background:var(--success);color:#fff;}

  /* ---------- Cash exam form ---------- */
  .denom-table td,.denom-table th{padding:6px 10px;}
  .denom-table input[type=number]{width:80px;text-align:right;}
  .exam-total-row td{font-weight:700;background:var(--surface-2);}
  .result-banner{
    display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:10px;margin:16px 0;
    border:1px solid var(--border);flex-wrap:wrap;gap:10px;
  }
  .result-banner .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .result-banner .amt{font-family:var(--font-display);font-size:24px;font-weight:700;}
  .result-balanced{background:var(--success-soft);color:var(--success);}
  .result-shortage{background:var(--critical-soft);color:var(--critical);}
  .result-overage{background:var(--warning-soft);color:var(--warning);}

  .items-add-row{display:flex;gap:8px;margin-top:8px;}
  .rm-row-btn{background:none;border:none;color:var(--critical);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;}

  .print-doc{font-family:var(--font-body);color:#111;}
  .print-doc h2{font-family:var(--font-display);font-size:16px;text-align:center;margin-bottom:2px;}
  .print-doc .print-sub{text-align:center;font-size:11.5px;color:#555;margin-bottom:16px;}
  .print-doc table{margin-bottom:14px;}
  .print-doc th,.print-doc td{border:1px solid #999;padding:5px 8px;font-size:12px;}
  .print-doc .sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px;}
  .print-doc .sign-line{border-top:1px solid #333;margin-top:38px;padding-top:4px;font-size:11.5px;text-align:center;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
  }


  .split-2col{display:grid;gap:20px;align-items:flex-start;}
  .split-2col.uta{grid-template-columns:270px minmax(0,1fr);}
  .split-2col.exam{grid-template-columns:260px minmax(0,1fr);}
  @media (max-width:900px){ .split-2col.uta, .split-2col.exam{grid-template-columns:minmax(0,1fr);} }
  /* ---------- UTA org chart ---------- */
  .org-board{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:12px 14px;margin-bottom:18px;}
  .org-board-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink-3);margin-bottom:9px;}
  .org-board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .org-board-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;}
  .org-board-card:hover{border-color:var(--accent);}
  ul.org-tree{list-style:none;margin:0;padding:0 0 0 0;}
  ul.org-tree ul.org-tree{padding-left:22px;position:relative;}
  ul.org-tree ul.org-tree::before{content:"";position:absolute;left:8px;top:0;bottom:14px;border-left:1px solid var(--border-strong);}
  li.org-node{position:relative;margin-bottom:8px;}

(function(){

/* ========================= UTIL ========================= */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function peso(n){
  n = Number(n)||0;
  return "₱" + n.toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso, opts){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-PH", opts || {month:"short", day:"numeric", year:"numeric"});
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function toast(msg, kind){
  const wrap = document.getElementById("toastwrap");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " "+kind : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 3600);
}
function refocusEnd(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  const n = el.value.length;
  try{ el.setSelectionRange(n, n); }catch(e){}
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return ((parts[0]||"")[0]||"") .toUpperCase() + ((parts[1]||"")[0]||"").toUpperCase();
}


/* ========================= LOCAL IDENTITY ========================= */
const Me = {
  get(){
    try{
      const raw = localStorage.getItem("audithub_me");
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  set(name){
    try{ localStorage.setItem("audithub_me", JSON.stringify({name: name.trim()})); }catch(e){}
  }
};


/* ========================= INSTALL / OFFLINE ========================= */
let deferredPrompt = null;

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function dismissedInstall(){
  try{ return localStorage.getItem("gf74a_install_dismissed") === "1"; }catch(e){ return false; }
}
function renderInstallBar(){
  const bar = document.getElementById("pwaInstall");
  if(!bar) return;
  if(isStandalone() || dismissedInstall()){ bar.classList.remove("show"); return; }
  if(deferredPrompt){
    bar.innerHTML = `<span class="grow"><strong>Install this on your phone</strong> — it then opens like an app and works with no signal.</span>
      <button class="btn btn-sm btn-primary" id="pwaGo">Install</button>
      <button class="btn btn-sm btn-ghost" id="pwaNo">Not now</button>`;
    bar.classList.add("show");
  } else if(isIOS()){
    bar.innerHTML = `<span class="grow"><strong>Install this on your iPhone</strong> — tap the Share button, then
      <em>Add to Home Screen</em>. It then opens like an app and works with no signal.</span>
      <button class="btn btn-sm btn-ghost" id="pwaNo">Got it</button>`;
    bar.classList.add("show");
  } else {
    bar.classList.remove("show");
  }
}
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  renderInstallBar();
});
window.addEventListener("appinstalled", ()=>{
  deferredPrompt = null;
  const bar = document.getElementById("pwaInstall");
  if(bar) bar.classList.remove("show");
  toast("Installed. You can open it from your home screen, with or without a signal.", "ok");
});
document.addEventListener("click", async (e)=>{
  if(e.target.closest("#pwaGo")){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(err){}
    deferredPrompt = null;
    renderInstallBar();
    return;
  }
  if(e.target.closest("#pwaNo")){
    try{ localStorage.setItem("gf74a_install_dismissed","1"); }catch(err){}
    const bar = document.getElementById("pwaInstall");
    if(bar) bar.classList.remove("show");
    return;
  }
});

function renderNetworkDot(){
  const dot = document.getElementById("netDot");
  if(!dot) return;
  if(navigator.onLine){ dot.classList.remove("show"); }
  else { dot.textContent = "Offline — everything still works"; dot.classList.add("show"); }
}
window.addEventListener("online", renderNetworkDot);
window.addEventListener("offline", renderNetworkDot);



/* ========================= APP STATE ========================= */
const State = {
  view: "cashexam",
  collections: { cashexams: [] },
  lastAgency: "",
  exam: null, examAo: 0,
};

/* ========================= DEVICE STORAGE ========================= */
/* Everything this app keeps lives on this device. Nothing is uploaded. */
const Store = {
  KEY: "gf74a_saved_v1",
  DRAFT: "gf74a_draft_v1",
  AGENCY: "gf74a_agency_v1",
  ok: true,
  read(){
    try{
      const raw = localStorage.getItem(this.KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  },
  write(arr){
    try{ localStorage.setItem(this.KEY, JSON.stringify(arr)); return true; }
    catch(e){ this.ok = false; return false; }
  },
  sort(arr){ return arr.slice().sort((a,b)=>String(b.examDate||"").localeCompare(String(a.examDate||""))); },
  refresh(){ State.collections.cashexams = this.sort(this.read()); },
  put(rec){
    const arr = this.read();
    const i = arr.findIndex(x=>x.id===rec.id);
    if(i>=0) arr[i] = rec; else arr.push(rec);
    const ok = this.write(arr);
    this.refresh();
    return ok;
  },
  remove(id){
    const ok = this.write(this.read().filter(x=>x.id!==id));
    this.refresh();
    return ok;
  },
  parkDraft(){
    try{
      localStorage.setItem(this.DRAFT, JSON.stringify(State.exam));
      if(State.exam && State.exam.agency) localStorage.setItem(this.AGENCY, State.exam.agency);
    }catch(e){ this.ok = false; }
  },
  takeDraft(){
    try{
      const raw = localStorage.getItem(this.DRAFT);
      const d = raw ? JSON.parse(raw) : null;
      return (d && Array.isArray(d.aos) && d.aos.length) ? d : null;
    }catch(e){ return null; }
  },
  probe(){
    try{ localStorage.setItem("gf74a_probe","1"); localStorage.removeItem("gf74a_probe"); this.ok = true; }
    catch(e){ this.ok = false; }
    return this.ok;
  }
};

/* ========================= RENDER ROOT ========================= */
function render(){
  document.getElementById("app").innerHTML = `
    <div class="shell">
      <main class="main">
        <div class="pwa-bar" id="pwaInstall"></div>
        <header class="topbar">
          <div style="display:flex;align-items:center;gap:12px;min-width:0;">
            <div class="brand-crest" style="flex:none;">74A</div>
            <div style="min-width:0;">
              <h1>Cash Count Generator</h1>
              <div class="sub">by A.R.C. Alberto &middot; General Form No. 74(A)</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;">
            <span class="offline-dot" id="netDot"></span>
            <button class="btn btn-sm" id="aboutBtn">${ICONS.info} About</button>
            ${renderIdentityWidget()}
          </div>
        </header>
        <div class="view" id="viewport"></div>
      </main>
    </div>
  `;
  renderViewport();
  renderInstallBar();
  renderNetworkDot();
}
function renderIdentityWidget(){
  const me = Me.get();
  return `<button class="btn btn-sm" id="identityBtn">${me ? esc(me.name) : "Set your name"}</button>`;
}
function renderViewport(){
  document.getElementById("viewport").innerHTML = viewCashExam();
  bindCashExamEvents();
}

/* ========================= INIT ========================= */
document.addEventListener("DOMContentLoaded", init);

function init(){
  Store.probe();
  Store.refresh();
  try{ State.lastAgency = localStorage.getItem(Store.AGENCY) || ""; }catch(e){}
  const draft = Store.takeDraft();
  State.exam = draft || newSession();
  if(draft){
    State.exam.aos.forEach(a=>{ const fresh = newAO(a.label).denoms; a.denoms = Object.assign(fresh, a.denoms||{}); });
    if(State.exam.id && !State.collections.cashexams.some(x=>x.id===State.exam.id)) State.exam.id = null;
  }
  render();
  document.getElementById("app").addEventListener("click", (e)=>{
    if(e.target.closest("#identityBtn")){ openIdentityModal(); return; }
    if(e.target.closest("#aboutBtn")){ openAboutModal(); return; }
  });
  if(!Store.ok){
    toast("This browser is blocking site storage, so nothing will be remembered between visits.", "err");
  }
  const secure = location.protocol === "https:" || ["localhost","127.0.0.1"].indexOf(location.hostname) >= 0;
  if("serviceWorker" in navigator && secure){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}

/* ========================= MODALS ========================= */
function openModal(html, opts){
  closeModal();
  const wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.id = "modalBackdrop";
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", (e)=>{ if(e.target === wrap) closeModal(); });
  document.querySelectorAll("[data-modal-close]").forEach(b=>b.addEventListener("click", closeModal));
  if(opts && opts.onMount) opts.onMount(wrap);
}
function closeModal(){
  const el = document.getElementById("modalBackdrop");
  if(el) el.remove();
}
function confirmDialog(message, okLabel){
  return new Promise((resolve)=>{
    openModal(`
      <div class="modal" style="max-width:420px;">
        <div class="modal-head"><h3>Please confirm</h3><button class="modal-close" data-modal-close>&times;</button></div>
        <div class="modal-body"><p style="margin:0;font-size:13.5px;">${esc(message)}</p></div>
        <div class="modal-foot">
          <button class="btn" data-modal-close>Cancel</button>
          <button class="btn btn-primary" id="confirmOk" style="background:var(--critical);border-color:var(--critical);color:#fff;">${esc(okLabel||"Yes, continue")}</button>
        </div>
      </div>
    `, { onMount(wrap){
      let done=false;
      wrap.querySelector("#confirmOk").addEventListener("click", ()=>{ done=true; closeModal(); resolve(true); });

/* ========================= CASH EXAMINATION (GF 74-A) ========================= */
const BILLS = [1000,500,200,100,50,20];
const COINS = [20,10,5,1,0.25,0.10,0.05,0.01];
const DENOM_ROWS = { "1000":26,"500":27,"200":28,"100":29,"50":30,"20":31, "c20":33,"c10":34,"c5":35,"c1":36,"c0_25":37,"c0_1":38,"c0_05":39,"c0_01":40 };
const AO_PRESETS = ["Cashier","Teller/AO 1","Teller/AO 2","Teller/AO 3","Teller/AO 4","Teller/AO 5","Teller/AO 6","Petty Cash Custodian","Disbursing Officer","Collecting Officer"];
function denomKey(v, isCoin){ return isCoin ? "c"+String(v).replace(".","_") : String(v); }
function denomValue(k){ return parseFloat(k.startsWith("c") ? k.slice(1).replace("_",".") : k); }
function longDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
}
function money(n){ return "₱" + (Number(n)||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

function newAO(label){
  const denoms = {};
  BILLS.forEach(v=>denoms[denomKey(v,false)]=0);
  COINS.forEach(v=>denoms[denomKey(v,true)]=0);
  return { id: uid(), label: label||"Cashier", name:"", position: label==="Petty Cash Custodian" ? "Petty Cash Custodian" : (label||"").toUpperCase().includes("TELLER") ? "Teller" : "Cashier",
    maxAccountability:"", bondAmount:"", riskNo:"", bondEffective:"",
    denoms, pcvPresented:0, pcvAllowed:0, checks:[], cashAdvances:[], formsWithValue:[], formsNoValue:[],
    witness1:"", witness2:"", remarks:"" };
}
function newSession(){
  const me = Me.get();
  return { id:null, agency: State.lastAgency||"", station:"", examDate: todayISO(), auditor: me?me.name:"", auditorDesignation:"", aos:[newAO("Cashier")] };
}
/* ---- computed totals ---- */
function aoTotals(ao){
  let cash=0;
  BILLS.forEach(v=>cash+=v*num(ao.denoms[denomKey(v,false)]));
  COINS.forEach(v=>cash+=v*num(ao.denoms[denomKey(v,true)]));
  const checks = ao.checks.reduce((s,c)=>s+num(c.amount),0);
  const checksAllowed = ao.checks.reduce((s,c)=>s+(c.allowed===false?0:num(c.amount)),0);
  const cas = ao.cashAdvances.reduce((s,c)=>s+Math.max(0,num(c.granted)-num(c.cashOnHand)),0);
  const pcv = num(ao.pcvPresented), pcvAllowed = Math.min(num(ao.pcvAllowed), pcv);
  const presented = pcv + checks + cas, allowed = pcvAllowed + checksAllowed + cas;
  const formsValue = ao.formsWithValue.reduce((s,f)=>s+num(f.amount),0);
  const formsNoValueQty = ao.formsNoValue.reduce((s,f)=>s+formQty(f),0);
  return { cash, checks, checksAllowed, cas, pcv, pcvAllowed, presented, allowed, disallowed: presented-allowed, total: cash+presented, totalAllowed: cash+allowed, formsValue, formsNoValueQty };
}
function formQty(f){
  if(f.qty!=="" && f.qty!=null && !isNaN(parseFloat(f.qty))) return num(f.qty);
  const a=parseInt(String(f.serialFrom||"").replace(/\D/g,""),10), b=parseInt(String(f.serialTo||"").replace(/\D/g,""),10);
  if(!isNaN(a)&&!isNaN(b)&&b>=a) return b-a+1;
  return 0;
}

function viewConsolidated(ex){
  if(ex.aos.length<1) return "";
  const totals = ex.aos.map(aoTotals);

/* ---- state binding ---- */
function setPath(obj, path, value){
  const parts = path.split("."); let o = obj;
  for(let i=0;i<parts.length-1;i++){ o = o[parts[i]]; if(o==null) return; }
  o[parts[parts.length-1]] = value;
}
function getPath(obj, path){ return path.split(".").reduce((o,k)=>o==null?undefined:o[k], obj); }

function refreshAoTotals(){
  const ex = State.exam, ao = ex.aos[State.examAo]; if(!ao) return;

  vp.querySelectorAll("[data-amt]").forEach(el=>{ const k=el.getAttribute("data-amt"); const v = denomValue(k); el.textContent = peso(num(ao.denoms[k])*v); });

/* ---- Excel generation (ExcelJS) ---- */
async function ensureExcelJS(){
  if(window.ExcelJS) return window.ExcelJS;
  await new Promise((res)=>{ const s=document.createElement("script"); s.src="exceljs.min.js"; s.onload=res; s.onerror=res; document.head.appendChild(s); });
  return window.ExcelJS || null;
}
function b64ToBuf(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }

/* ---- file delivery (no artifact sandbox here: a plain blob download works) ---- */
function nativeSave(filename, blob){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 2000);
    return true;
  }catch(e){ return false; }
}

async function saveWorkbook(wb, filename){
  const raw = await wb.xlsx.writeBuffer();
  // ExcelJS returns a Buffer view that may sit inside a larger pooled ArrayBuffer — copy exactly the bytes we need
  const bytes = new Uint8Array(raw.buffer ? raw.buffer : raw, raw.byteOffset || 0, raw.byteLength).slice();
  if(window.__captureXlsx){ window.__captureXlsx(filename, bytes.buffer); return; }
  const blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  if(nativeSave(filename, blob)) toast("Saved "+filename, "ok");
  else toast("Couldn't save the file. Use View / Print instead.", "err");
}
function copyStyle(ws, from, to){ const a=ws.getCell(from), b=ws.getCell(to); b.numFmt=a.numFmt; b.font=a.font; b.alignment=a.alignment; }
function safeName(s){ return String(s||"AO").replace(/[^A-Za-z0-9 _-]+/g,"").trim().replace(/\s+/g,"_").slice(0,40) || "AO"; }

/* ========================= GENERAL FORM No. 74(A) — ON-SCREEN ========================= */
function up(s){ return String(s==null?"":s).toUpperCase(); }
function m0(v){ return v==="" || v==null ? "" : money(v); }

function cashItemRows(ao){
  const rows = [];
  const t = aoTotals(ao);
  rows.push({ label:"Petty Cash Fund Vouchers (See Appendix 1.1)", presented:t.pcv, allowed:t.pcvAllowed, disallowed:t.pcv-t.pcvAllowed });
  ao.checks.forEach(c=>{
    const amt = num(c.amount), all = c.allowed===false ? 0 : amt;
    rows.push({ label:`Check ${c.bank||""} #${c.checkNo||""}${c.payee?" – "+c.payee:""}`.replace(/\s+/g," ").trim(), presented:amt, allowed:all, disallowed:amt-all });
  });
  ao.cashAdvances.forEach(c=>{
    const u = Math.max(0, num(c.granted)-num(c.cashOnHand));
    rows.push({ label:`Unliq. CA – ${c.payee||""}${c.ref?" ("+c.ref+")":""}`.replace(/\s+/g," ").trim(), presented:u, allowed:u, disallowed:0 });
  });
  return rows;
}

function renderGF74A(ex, ao){
  const t = aoTotals(ao);
  const name = up(ao.name), pos = up(ao.position), agency = up(ex.agency), station = up(ex.station);
  const items = cashItemRows(ao);
  const denomLines = []
    .concat([{head:"Bills"}], BILLS.map(v=>({v, q:num(ao.denoms[denomKey(v,false)]), coin:false})))
    .concat([{head:"Coins"}], COINS.map(v=>({v, q:num(ao.denoms[denomKey(v,true)]), coin:true})));
  const bodyRows = Math.max(denomLines.length, items.length);

  const denomCell = (i)=>{
    const d = denomLines[i];
    if(!d) return `<td class="nb"></td><td class="nb"></td><td class="nb"></td>`;
    if(d.head) return `<td class="gf-b" colspan="3">${esc(d.head)}</td>`;
    return `<td class="gf-r">${d.v.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`
         + `<td class="gf-c">${d.q}</td><td class="gf-r">${(d.q*d.v).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`;
  };
  const itemCell = (i)=>{
    const it = items[i];
    if(!it) return `<td class="nb"></td><td class="nb"></td><td class="nb"></td><td class="nb"></td>`;
    return `<td>${esc(it.label)}</td><td class="gf-r">${it.presented.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`
         + `<td class="gf-r">${it.allowed.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`
         + `<td class="gf-r">${it.disallowed.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`;
  };

  const fwv = ao.formsWithValue.length ? ao.formsWithValue : [{name:"N O N E", qty:0, serial:"", denomination:"-", amount:0}];
  const fnv = ao.formsNoValue;
  const formRows = Math.max(fwv.length, fnv.length, 4);

  return `
  <div class="gf-doc" id="gfDoc">
    <div class="gf-top">
      <div>General Form No. 74(A)</div>
      <div class="gf-mid">Republic of the Philippines<br><strong>COMMISSION ON AUDIT</strong></div>
      <div style="width:130px;"></div>
    </div>
    <table>
      <tr><td class="gf-band" colspan="4">REPORT OF CASH EXAMINATION</td></tr>
      <tr><td colspan="2">Name of Accountable Officer: <strong>${esc(name)}</strong></td>
          <td colspan="2">Position/Designation: ${esc(pos)}</td></tr>
      <tr><td colspan="2">Agency: ${esc(agency)}</td><td colspan="2">Station: ${esc(station)}</td></tr>
      <tr><td colspan="2">Maximum Cash Accountability: ${esc(m0(ao.maxAccountability))}</td>
          <td>Amount of Bond: ${esc(m0(ao.bondAmount))}</td>
          <td>Risk No.: ${esc(ao.riskNo)} &nbsp; Effective Date: ${esc(ao.bondEffective)}</td></tr>
      <tr><td colspan="2">Auditor/Examiner:<div class="gf-c gf-b" style="margin-top:6px;">${esc(up(ex.auditor))}</div></td>
          <td colspan="2">Official Designation:<div class="gf-c gf-b" style="margin-top:6px;">${esc(up(ex.auditorDesignation))}</div></td></tr>
      <tr><td class="gf-band" colspan="4">A. &nbsp; CASH PRODUCTION NOTICE</td></tr>
      <tr><td colspan="2">TO: Accountable Officer: ${esc(name)}</td>
          <td>Position/Designation: ${esc(pos)}</td>
          <td>Date: ${esc(longDate(ex.examDate))}</td></tr>
      <tr><td colspan="4" style="height:96px;">
        <p class="gf-para">DEMAND, is hereby made that you produce all your cash, checks, money orders, cash items,
        paid vouchers, and/or unused accountable forms, etc., for which you are officially accountable as
        ${esc(pos||"______")} of the ${esc(agency||"______")} and any fund, checks, and/or cash items in your
        possession held by you for deposit and safekeeping.</p></td></tr>
      <tr><td style="width:14%;">NOTED AND COMPLIED WITH</td>
          <td>Accountable Officer's Signature:<div class="gf-c gf-b gf-sig" style="padding-top:14px;">${esc(name)}</div></td>
          <td>Date:<div class="gf-c gf-b gf-sig" style="padding-top:14px;">${esc(longDate(ex.examDate))}</div></td>
          <td>Auditor/Examiner's Signature:<div class="gf-c gf-b gf-sig" style="padding-top:14px;">${esc(up(ex.auditor))}</div></td></tr>
      <tr><td class="gf-band" colspan="4">B. &nbsp; CASH COUNT</td></tr>
    </table>

    <div class="gf-scroll">
    <table style="min-width:720px;">
      <colgroup><col style="width:11%"><col style="width:8%"><col style="width:14%"><col style="width:29%"><col style="width:12%"><col style="width:12%"><col style="width:14%"></colgroup>
      <tr><td class="gf-c gf-b" colspan="3">INVENTORY OF CASH ON HAND</td>
          <td class="gf-c gf-b" colspan="4">INVENTORY OF CASH ITEMS (Include checks, money orders, etc.)</td></tr>
      <tr><td class="gf-c" colspan="3">Paper and Coins:</td>
          <td rowspan="2" class="gf-c" style="vertical-align:bottom;">P a r t i c u l a r s</td>
          <td class="gf-c" colspan="3">Amount</td></tr>
      <tr><td class="gf-c">Denomination</td><td class="gf-c">No. of Pcs.</td><td class="gf-c">Amount</td>
          <td class="gf-c">Presented</td><td class="gf-c">Allowed</td><td class="gf-c">Disallowed</td></tr>
      ${Array.from({length:bodyRows}, (_,i)=>`<tr>${denomCell(i)}${itemCell(i)}</tr>`).join("")}
      <tr><td class="gf-b" colspan="2">Total, As Presented</td>
          <td class="gf-r gf-b">${esc(money(t.cash))}</td>
          <td class="gf-b">Total</td>
          <td class="gf-r gf-b">${esc(money(t.presented))}</td>
          <td class="gf-r gf-b">${esc(money(t.allowed))}</td>
          <td class="gf-r gf-b">${esc(money(t.disallowed))}</td></tr>
      <tr><td class="gf-b" colspan="6">TOTAL INVENTORY OF CASH AND/OR ALLOWED CASH ITEMS (TOD)</td>
          <td class="gf-r gf-b">${esc(money(t.total))}</td></tr>
    </table>
    </div>

    <div class="gf-scroll">
    <table style="min-width:720px;">
      <tr><td class="gf-band" colspan="8">C. &nbsp; INVENTORY OF UNUSED ACCOUNTABLE FORMS</td></tr>
      <tr><td class="gf-c gf-b" colspan="5">W i t h &nbsp; M o n e y &nbsp; V a l u e</td>
          <td class="gf-c gf-b" colspan="3">W i t h o u t &nbsp; M o n e y &nbsp; V a l u e</td></tr>
      <tr><td class="gf-c">Name of Form</td><td class="gf-c">Qty.</td><td class="gf-c">Inclusive Serial No.</td>
          <td class="gf-c">Denomination</td><td class="gf-c">Amount</td>
          <td class="gf-c">Name of Form</td><td class="gf-c">Qty.</td><td class="gf-c">Inc. Serial No.</td></tr>
      ${Array.from({length:formRows}, (_,i)=>{
        const a = fwv[i], b = fnv[i];
        return `<tr>
          <td>${a?esc(a.name):""}</td><td class="gf-c">${a?esc(a.qty===""?"":a.qty):""}</td><td>${a?esc(a.serial||""):""}</td>
          <td class="gf-c">${a?esc(a.denomination||""):""}</td><td class="gf-r">${a?esc(money(a.amount)):""}</td>
          <td>${b?esc(b.name):""}</td><td class="gf-c">${b?formQty(b):""}</td>
          <td>${b?esc([b.serialFrom,b.serialTo].filter(Boolean).join("-")):""}</td></tr>`;
      }).join("")}
      <tr><td class="gf-c gf-b" colspan="4">Total</td><td class="gf-r gf-b">${esc(money(t.formsValue))}</td>
          <td></td><td class="gf-c gf-b">${t.formsNoValueQty}</td><td></td></tr>
    </table>
    </div>

    <table>
      <tr><td class="gf-band">C E R T I F I C A T I O N</td></tr>
      <tr><td>
        <p class="gf-para">&nbsp;&nbsp;&nbsp;&nbsp;I HEREBY CERTIFY on my official oath: (1) That upon demand by the
        Auditor/Examiner I produced all my cash, checks, money orders, cash items, paid vouchers, unused accountable
        forms, etc., for which I am officially accountable; (2) That the inventory of such cash items and unused
        accountable forms in my possession and produced to the Auditor/Examiner at the time of cash count today
        ${esc(longDate(ex.examDate))} is correctly stated above and is broken down as follows:</p>
        <table style="width:70%;margin:12px auto;border:none;">
          <tr><td class="nb" style="text-align:right;">Cash and/or cash items &nbsp;……………………………</td>
              <td class="nb gf-r gf-b" style="border-bottom:1px solid #333;width:120px;">${esc(money(t.total))}</td></tr>
          <tr><td class="nb" style="text-align:right;">Unused accountable forms with money value …………</td>
              <td class="nb gf-r gf-b" style="border-bottom:1px solid #333;">${esc(money(t.formsValue))}</td></tr>
          <tr><td class="nb" style="text-align:right;">Unused accountable forms without money value ……</td>
              <td class="nb gf-r gf-b" style="border-bottom:1px solid #333;">${t.formsNoValueQty}</td></tr>
        </table>
        <p class="gf-para">of which ${esc(money(t.disallowed))} was disallowed by the Auditor/Examiner and (3) That said
        cash, checks, money orders, cash items, paid vouchers, unused accountable forms, etc., were returned to me
        intact after the cash count.</p>
      </td></tr>
    </table>

    <table>
      <tr><td style="width:34%;">Accountable Officer's Signature:<div class="gf-c gf-b gf-sig" style="padding-top:16px;">${esc(name)}</div></td>
          <td style="width:33%;">Position/Designation:<div class="gf-c gf-b gf-sig" style="padding-top:16px;">${esc(pos)}</div></td>
          <td>Agency/Station:<div class="gf-b" style="padding-top:6px;">${esc([agency,station].filter(Boolean).join(", "))}</div></td></tr>
      <tr><td class="gf-band" colspan="3">SIGNED IN THE PRESENCE OF:</td></tr>
      <tr><td colspan="2">Witness' name and signature: ${esc(ao.witness1)}</td>
          <td>Witness' name and signature: ${esc(ao.witness2)}</td></tr>
    </table>
    ${ao.remarks ? `<table style="margin-top:8px;"><tr><td><strong>Remarks:</strong> ${esc(ao.remarks)}</td></tr></table>` : ""}
  </div>`;
}

function renderDenomSummary(ex){
  const totalsAo = ex.aos.map(aoTotals);
  const grand = k => totalsAo.reduce((s,t)=>s+t[k], 0);
  const denomRowsHtml = (list, isCoin, head) => {
    let out = `<tr><td class="gf-b" colspan="${3+ex.aos.length*2}">${head}</td></tr>`;
    list.forEach(v=>{
      const k = denomKey(v, isCoin);
      let tq = 0;
      const cells = ex.aos.map(a=>{ const q = num(a.denoms[k]); tq += q;
        return `<td class="gf-c">${q}</td><td class="gf-r">${(q*v).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`; }).join("");
      out += `<tr><td class="gf-r">${v.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`
           + `<td class="gf-c gf-b">${tq}</td><td class="gf-r gf-b">${(tq*v).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`
           + cells + `</tr>`;
    });
    return out;
  };
  const lineRow = (label, key) => `<tr><td class="gf-b" colspan="2">${label}</td>`
      + `<td class="gf-r gf-b">${money(grand(key))}</td>`
      + totalsAo.map(t=>`<td colspan="2" class="gf-r">${money(t[key])}</td>`).join("") + `</tr>`;

  const checks = [];
  ex.aos.forEach(a=>a.checks.forEach(c=>checks.push({ao:a.label, ...c})));
  const cas = [];
  ex.aos.forEach(a=>a.cashAdvances.forEach(c=>cas.push({ao:a.label, ...c})));

  return `
  <div class="gf-doc" id="gfDoc">
    <h3 style="font-family:var(--font-display);font-size:15px;margin-bottom:2px;">CASH IN CURRENCY</h3>
    <div style="font-size:11px;margin-bottom:12px;">${esc([up(ex.agency), longDate(ex.examDate)].filter(Boolean).join(" — "))}</div>
    <div class="gf-scroll">
    <table style="min-width:${420 + ex.aos.length*180}px;">
      <tr><td rowspan="2" class="gf-c gf-b" style="vertical-align:middle;">Denomination</td>
          <td colspan="2" class="gf-c gf-b">TOTAL</td>
          ${ex.aos.map(a=>`<td colspan="2" class="gf-c gf-b">${esc(up(a.label + (a.name?" – "+a.name:"")))}</td>`).join("")}</tr>
      <tr><td class="gf-c">Pcs</td><td class="gf-c">Amount</td>
          ${ex.aos.map(()=>`<td class="gf-c">Pcs</td><td class="gf-c">Amount</td>`).join("")}</tr>
      ${denomRowsHtml(BILLS, false, "BILLS")}
      ${denomRowsHtml(COINS, true, "COINS")}
      ${lineRow("Cash on hand","cash")}
      <tr><td class="gf-b" colspan="${3+ex.aos.length*2}">CASH ITEMS</td></tr>
      ${lineRow("Checks","checks")}
      ${lineRow("Unliquidated CAs","cas")}
      ${lineRow("PCVs","pcv")}
      ${lineRow("TOTAL","total")}
    </table>
    </div>

    ${checks.length ? `<h3 style="font-family:var(--font-display);font-size:13px;margin:18px 0 6px;">Checks for deposit</h3>
    <div class="gf-scroll"><table style="min-width:640px;">
      <tr><td class="gf-b">AO</td><td class="gf-b">Bank</td><td class="gf-b">Check no.</td><td class="gf-b">Date</td>
          <td class="gf-b">Payee</td><td class="gf-b gf-r">Amount</td><td class="gf-b gf-c">Allowed</td></tr>
      ${checks.map(c=>`<tr><td>${esc(c.ao)}</td><td>${esc(c.bank)}</td><td>${esc(c.checkNo)}</td><td>${esc(c.date)}</td>
        <td>${esc(c.payee)}</td><td class="gf-r">${money(c.amount)}</td><td class="gf-c">${c.allowed===false?"No":"Yes"}</td></tr>`).join("")}
      <tr><td class="gf-b" colspan="5">TOTAL</td><td class="gf-r gf-b">${money(grand("checks"))}</td><td></td></tr>
    </table></div>` : ""}

    ${cas.length ? `<h3 style="font-family:var(--font-display);font-size:13px;margin:18px 0 6px;">Unliquidated cash advances</h3>
    <div class="gf-scroll"><table style="min-width:640px;">
      <tr><td class="gf-b">AO</td><td class="gf-b">Payee</td><td class="gf-b">Reference</td><td class="gf-b">Date</td>
          <td class="gf-b gf-r">Granted</td><td class="gf-b gf-r">Cash on hand</td><td class="gf-b gf-r">Unliquidated</td></tr>
      ${cas.map(c=>`<tr><td>${esc(c.ao)}</td><td>${esc(c.payee)}</td><td>${esc(c.ref||"")}</td><td>${esc(c.date)}</td>
        <td class="gf-r">${money(c.granted)}</td><td class="gf-r">${money(c.cashOnHand)}</td>
        <td class="gf-r">${money(Math.max(0,num(c.granted)-num(c.cashOnHand)))}</td></tr>`).join("")}
      <tr><td class="gf-b" colspan="6">TOTAL</td><td class="gf-r gf-b">${money(grand("cas"))}</td></tr>
    </table></div>` : ""}
  </div>`;
}

/* ---- overlay plumbing ---- */
function openSheet(title, html, tsv){
  closeSheet();
  const wrap = document.createElement("div");
  wrap.className = "gf-overlay";
  wrap.id = "gfOverlay";
  wrap.innerHTML = `
    <div class="gf-sheet">
      <div class="gf-actions">
        <span class="gf-hint">${esc(title)}</span>
        <button class="btn btn-sm" id="gfPrint">${ICONS.print} Print / Save as PDF</button>
        <button class="btn btn-sm" id="gfCopy">Copy for Excel</button>
        <button class="btn btn-sm btn-primary" id="gfClose">Close</button>
      </div>
      ${html}
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", (e)=>{ if(e.target === wrap) closeSheet(); });
  wrap.querySelector("#gfClose").addEventListener("click", closeSheet);
  wrap.querySelector("#gfPrint").addEventListener("click", ()=>{
    try{ window.print(); }
    catch(e){ toast("Your browser blocked printing here — use the browser's own Print command.", "err"); }
  });
  wrap.querySelector("#gfCopy").addEventListener("click", ()=>openCopyBox(tsv));
  document.addEventListener("keydown", escSheet);
}
function closeSheet(){
  const el = document.getElementById("gfOverlay");
  if(el) el.remove();
  document.removeEventListener("keydown", escSheet);
}
function escSheet(e){ if(e.key === "Escape") closeSheet(); }

function openCopyBox(tsv){
  openModal(`
    <div class="modal" style="max-width:620px;">
      <div class="modal-head"><h3>Copy into Excel</h3><button class="modal-close" data-modal-close>&times;</button></div>
      <div class="modal-body">
        <p class="helptext" style="margin-bottom:10px;">Everything below is already selected. Press
        <strong>Ctrl+C</strong> (<strong>⌘C</strong> on a Mac), then paste into a blank sheet — the columns land
        in separate cells.</p>
        <textarea class="gf-copybox" id="gfTsv" readonly>${esc(tsv)}</textarea>
      </div>
      <div class="modal-foot"><button class="btn btn-primary" data-modal-close>Done</button></div>
    </div>
  `, { onMount(wrap){
    const ta = wrap.querySelector("#gfTsv");
    ta.focus(); ta.select();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>toast("Copied to the clipboard.", "ok")).catch(()=>{});
    }
  }});
}

/* ---- tab-separated renditions ---- */
function tsvGF74A(ex, ao){
  const t = aoTotals(ao), L = [], row = (...c)=>L.push(c.join("\t"));
  row("REPORT OF CASH EXAMINATION — General Form No. 74(A)");
  row("Name of Accountable Officer", up(ao.name)); row("Position/Designation", up(ao.position));
  row("Agency", up(ex.agency)); row("Station", up(ex.station));
  row("Maximum Cash Accountability", num(ao.maxAccountability)); row("Amount of Bond", num(ao.bondAmount));
  row("Risk No.", ao.riskNo); row("Bond effective", ao.bondEffective);
  row("Auditor/Examiner", up(ex.auditor)); row("Official Designation", up(ex.auditorDesignation));
  row("Date of cash count", longDate(ex.examDate)); row("");
  row("INVENTORY OF CASH ON HAND"); row("Denomination","No. of Pcs.","Amount");
  row("Bills");
  BILLS.forEach(v=>{ const q = num(ao.denoms[denomKey(v,false)]); row(v, q, q*v); });
  row("Coins");
  COINS.forEach(v=>{ const q = num(ao.denoms[denomKey(v,true)]); row(v, q, q*v); });
  row("Total, As Presented","", t.cash); row("");
  row("INVENTORY OF CASH ITEMS"); row("Particulars","Presented","Allowed","Disallowed");
  cashItemRows(ao).forEach(it=>row(it.label, it.presented, it.allowed, it.disallowed));
  row("Total","", t.presented, t.allowed, t.disallowed);
  row("TOTAL INVENTORY OF CASH AND/OR ALLOWED CASH ITEMS (TOD)","", t.total); row("");
  row("UNUSED ACCOUNTABLE FORMS — WITH MONEY VALUE");
  row("Name of Form","Qty.","Inclusive Serial No.","Denomination","Amount");
  ao.formsWithValue.forEach(f=>row(f.name, f.qty, f.serial, f.denomination, num(f.amount)));
  row("Total","","","", t.formsValue); row("");
  row("UNUSED ACCOUNTABLE FORMS — WITHOUT MONEY VALUE");
  row("Name of Form","Qty.","Inclusive Serial No.");
  ao.formsNoValue.forEach(f=>row(f.name, formQty(f), [f.serialFrom,f.serialTo].filter(Boolean).join("-")));
  row("Total", t.formsNoValueQty); row("");
  row("Witnesses", ao.witness1, ao.witness2);
  if(ao.remarks) row("Remarks", ao.remarks);
  return L.join("\n");
}

function tsvDenom(ex){
  const totalsAo = ex.aos.map(aoTotals), L = [], row = (...c)=>L.push(c.join("\t"));
  const grand = k => totalsAo.reduce((s,t)=>s+t[k], 0);
  row("CASH IN CURRENCY", up(ex.agency), longDate(ex.examDate)); row("");
  row("Denomination", "TOTAL Pcs", "TOTAL Amount", ...ex.aos.flatMap(a=>[a.label+" Pcs", a.label+" Amount"]));
  const block = (list, isCoin, head)=>{
    row(head);
    list.forEach(v=>{
      let tq = 0;
      const cells = ex.aos.flatMap(a=>{ const q = num(a.denoms[denomKey(v,isCoin)]); tq += q; return [q, q*v]; });
      row(v, tq, tq*v, ...cells);
    });
  };
  block(BILLS, false, "BILLS"); block(COINS, true, "COINS");
  const line = (label,key)=>row(label, "", grand(key), ...ex.aos.map((a,i)=>["", totalsAo[i][key]]).flat());
  line("Cash on hand","cash"); row("CASH ITEMS");
  line("Checks","checks"); line("Unliquidated CAs","cas"); line("PCVs","pcv"); line("TOTAL","total");
  return L.join("\n");
}

function showGF74A(ex, ao){
  if(!ao){ toast("Add an accountable officer first.", "err"); return; }
  openSheet(`GF 74(A) — ${ao.name || ao.label}`, renderGF74A(ex, ao), tsvGF74A(ex, ao));
}
function showDenomSummary(ex){
  openSheet(`Denomination summary — ${ex.agency || "cash count"}`, renderDenomSummary(ex), tsvDenom(ex));
}


})();
